<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Understand my partner · ListenHours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <h1>Understand my partner</h1>
    <p class="lede">Think about your partner or the person you're dating. For each line, choose how true it is of them, based on everything you've seen. One example being true is enough to count.</p>
    <form id="quiz" novalidate>
      <div id="items"></div>
      <div class="actions">
        <button class="btn" type="submit">See what it tells me</button>
        <span class="muted small" id="status" role="status"></span>
      </div>
    </form>
    <section id="result" class="result" tabindex="-1" hidden></section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="js/pages/partner-style.js"></script>
</body>
</html>
